kind = "web"
previewPath = "/"
title = "Campus Clubs Hub"
description = "A unified college platform for discovering clubs, understanding membership and leadership roles, finding upcoming events, registering with clear criteria, and checking venue and duty-leave details."
version = "1.0.0"
id = "artifacts/campus-clubs-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23905

[services.development]
run = "pnpm --filter @workspace/campus-clubs-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-clubs-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-clubs-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23905"
BASE_PATH = "/"
